# Training settings
n_epochs: 100
batch_size: 128 # 128
eval_batch_size: 256 # 1024
lr: 0.0001 # 0.0015 for training, 0.0002 for fine-tuning.
           # Halved from 0.0002: sqrt scaling at 4 nodes turned 0.0002 into
           # 0.001131, which diverged at epoch 24 (~80% up the one-cycle ramp).
           # 0.0001 -> 0.000566 at 4 nodes. Note this is a *base* value; the
           # effective LR is base * sqrt(gpus * num_nodes), see spec2mol_main.py.
clip_grad: 1.0           # float, null to disable. Was null; a single large update
                         # near the one-cycle LR peak (~epoch 30 at pct_start=0.3)
                         # saturated the encoder's output sigmoid and froze training
                         # at epoch 24 (metrics static to 4 dp thereafter).
save_model: True
num_workers: 6 # 8
pin_memory: True
ema_decay: 0          # EMA decay current not implemented
progress_bar: false
weight_decay: 1e-12
optimizer: adamw # adamw | nadamw | nadam | radam
scheduler: 'one_cycle' # 'const' | 'one_cycle'
pct_start: 0.3
seed: 42
trainer_strategy: 'auto' # 'ddp_find_unused_parameters_true' for .ckpt checkpoint compatibility
ddp_timeout_hours: 20    # NCCL watchdog deadline for every collective (PyTorch default
                         # is 0.5h). Must exceed the worst rank-to-rank SKEW, not the
                         # epoch length. The test epoch sets it: ~2 sampling batches
                         # per rank at eval_batch_size=256, cost driven by the largest
                         # molecule in each batch, and measured rates on 2026-07-27
                         # spanned 1.58-4.85 it/s — a 3x spread with no averaging-out,
                         # so the first rank to finish can wait most of the run.
                         # Set close to the SLURM walltime deliberately: a genuine
                         # hang is now caught by the per-candidate heartbeat and the
                         # SIGUSR1 stack dump, so the watchdog no longer needs to be
                         # the detector and a short deadline only kills healthy runs.

# Epoch truncation. Declared here (rather than relied on via getattr) so Hydra's
# struct mode accepts a plain `train.limit_train_batches=N` override — an absent
# key requires the `+` prefix and otherwise aborts every rank at startup.
# NOTE the float/int distinction, which Lightning treats as different units:
#   1.0 = the whole epoch (100%)      1 = exactly one batch
limit_train_batches: 1.0
limit_val_batches: 1.0
