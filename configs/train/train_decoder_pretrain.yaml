# Training settings
n_epochs: 100
total_steps: 5000000
batch_size: 64
eval_batch_size: 64
lr: 0.0005 # 0.001 for training, 0.0002 for fine-tuning
clip_grad: null          # float, null to disable
save_model: True
num_workers: 8
pin_memory: True
ema_decay: 0          # EMA decay current not implemented
progress_bar: false
weight_decay: 1e-12
optimizer: adamw # adamw | nadamw | nadam
scheduler: 'one_cycle' # 'const' | 'one_cycle'
pct_start: 0.3
seed: 42
limit_val_batches: 1.0 # 'float', 1.0 default (full val batch)
fraction_train_epoch: 1.0
precision: "32-true"
