# Training settings
n_epochs: 100
total_steps: null        # null = derive from the real step count. A fixed value only suits
                         # one GPU count: 100 epochs on 32 GCDs is ~154k steps, so the old
                         # 5,000,000 would end the run early in the one-cycle warm-up.
batch_size: 64           # per GCD, so 2048 per step across 32 GCDs
eval_batch_size: 64
lr: 0.000088388          # Base value: fp2mol_main.py multiplies it by sqrt(gpus * num_nodes).
                         # 5e-4 / sqrt(32) gives the article's peak LR of 5e-4 on 32 GCDs.
                         # Recompute it for any other GCD count.
clip_grad: null          # float, null to disable
save_model: True
num_workers: 6           # LUMI-G gives each GCD 7 CPUs: 6 workers plus the main process
pin_memory: True
ema_decay: 0          # EMA decay current not implemented
progress_bar: false
weight_decay: 1e-12
optimizer: adamw # adamw | nadamw | nadam
scheduler: 'one_cycle' # 'const' | 'one_cycle'
pct_start: 0.3
seed: 42
limit_val_batches: 1.0 # 'float', 1.0 default (full val batch)
fraction_train_epoch: 1.0
precision: "32-true"

# DDP. 'auto' lets fp2mol_main.py pick: plain 'auto' on a single device,
# 'ddp_find_unused_parameters_true' when WORLD_SIZE > 1 (needed to load older
# checkpoints). Override with an explicit strategy name to pin it.
trainer_strategy: 'auto'
ddp_timeout_hours: 20    # NCCL watchdog deadline for every collective (PyTorch default
                         # is 0.5h). Must exceed the worst rank-to-rank SKEW, not the
                         # epoch length -- the test epoch generates on every batch and
                         # cost scales with molecule size, so the first rank to reach
                         # the epoch-end barrier can wait most of the run.
