# Yee et al. — pure inference. Spectra + molecular formulas, no known structures.
#
# UCB-GLOBES 2025 v1 (Yee et al., AMT 19, 5027, 2026; Zenodo 10.5281/zenodo.18176761).
# Built by neims-pipeline: `bash run_pipeline.sh --stage yee`, which downloads the MSP
# and runs scripts/yee_preprocessing.py. Copy its data/neims/yee/mist_inputs/ here.
#
# PATHS ARE REPO-RELATIVE HERE, unlike every other dataset config.
# The training configs use '../../../data/...' because spec2mol_main.py runs under
# @hydra.main with chdir: True, which puts the cwd three levels deep in
# outputs/<date>/<time>-<name>/. src/inference.py instead uses the Compose API
# (hydra.initialize + hydra.compose), which never chdirs — so these resolve from
# wherever the process was launched. Run it from the repo root.
name: yee
remove_h: True # Drop explicit hydrogens; the graph carries heavy atoms only.

# Prior for the diffusion process (node/edge marginals, node-count histogram).
# MUST match the data the checkpoint below was trained on — it defines limit_dist,
# the distribution sample_batch() draws its initial noise from. These spectra are
# MSTFA-derivatized (Si in ~80% of formulas), so use a TMS-trained model and its
# training set's stats. Training writes atom_types/edge_types here and
# n_counts/valencies one level up; InferenceDatasetInfos looks in both.
stats_dir: 'data/neims/gecko_tms_mixed_augment_tms_atmomaccs_tms_test/mist_inputs/stats'
datadir: 'data/neims/yee/mist_inputs'

# No default on purpose: every Yee result so far came from models trained on the
# 20/10 ppm subformulae. Pass a checkpoint trained on the 0.5 Da annotations:
#   python src/inference.py dataset.eval_model_path=/path/to/last.ckpt
eval_model_path: ???

inference_only: True # No ground-truth structures: skips the NLL/KL losses.
filter: False # Structure validity filtering — nothing to filter against here.
denoise_nodes: False
merge: 'downproject_4096'  # Must match the checkpoint's merge strategy.
morgan_nbits: 2048
morgan_r: 2
split_file: null # Inference loads every spectrum in labels.tsv; no split applies.

spec_features: 'peakformula'
mol_features: 'none' # 'fingerprint' would need real molecules; we have none.

# Subformulae assigned with mass_diff_da: 0.5, the same absolute window as the
# NEIMS training data. The library is unit mass resolution (integer m/z), so the
# old 15-20 ppm window annotated only ~45% of peaks; 0.5 Da annotates ~97%.
subform_folder: 'data/neims/yee/mist_inputs'
subform_pkl: True
subform_pkl_file: 'yee_subforms_3_9_22.pkl'

# Augmentation off: it perturbs peaks to regularise training and has no place in
# inference, where we want the model's read of the actual spectrum.
augment_data: False
remove_prob: 0.0
remove_weights: 'uniform'
inten_prob: 0.0
inten_transform: 'log' # Intensity scaling — must match how the model was trained.
cls_type: 'zeros'
magma_aux_loss: False

# labels.tsv: the MIST columns (dataset, spec, ionization, formula, smiles, inchikey,
# instrument; smiles/inchikey empty) plus library metadata — compound_name,
# identified, cas, exact_mass, derivatization, source, conditions, retention_index.
# spec is the library UID (LDY-…). All 730 entries with a usable formula are
# included; filter on `identified` for the 477 named compounds.
labels_file: 'data/neims/yee/mist_inputs/labels.tsv'

# The collated pickle carries a UID column, so spectra are matched to labels.tsv
# by key, not by row position.
spec_folder: 'data/neims/yee/mist_inputs'
collated_pkl: True
collated_pkl_file: 'df_neims_yee_3_9_22.pkl'

cache_featurizers: False
set_pooling: 'intensity'
max_count: null # No cap on spectra; set an int to smoke-test on a subset.
